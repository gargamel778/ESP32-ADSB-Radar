; Hardware bring-up diagnostic for the VIEWE UEDX80480070E-WB-A (7" 800x480, ESP32-S3 N16R8).
; Open THIS folder as the PlatformIO project.
;
; Toolchain is the same pinned pioarduino platform the ESP32-RC-Radio projects use
; (Arduino core 3.2.x / ESP-IDF 5.4), PlatformIO Core 6.1.19, 'click<8.2'.
;
; Programming goes through the port labelled UART (CH340C -> UART0). The port labelled USB is
; not a data port on this board. CH340 bulk reads are unreliable above 115200 baud on this
; setup, so uploads use 230400.

[platformio]
src_dir = src

[env:viewe7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi     ; 16 MB quad flash + 8 MB octal PSRAM (confirmed by esptool)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 230400
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0        ; console on UART0 (the CH340), not native USB
    -DCORE_DEBUG_LEVEL=1
    -I${PROJECT_DIR}/../../config
lib_deps =
    lovyan03/LovyanGFX@1.2.32
    bblanchon/ArduinoJson@^7.4.0
