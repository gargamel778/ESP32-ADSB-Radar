; ESP32 ADS-B Radar firmware — VIEWE UEDX80480070E-WB-A (7" 800x480, ESP32-S3 N16R8, GT911).
; Open THIS folder as the PlatformIO project; build with PlatformIO's private env:
;     ~/.platformio/penv/bin/pio run -t upload
; Programming port = the USB-C labelled UART (CH340C). See ../docs/hardware-findings.md.

[platformio]
src_dir = src
; per-computer settings (serial port) live in platformio.local.ini, which is not committed: copy platformio.local.ini.example
extra_configs = platformio.local*.ini

; Wi-Fi upload with PlatformIO's espota (needs the radar's web PIN, shown under Settings > Wi-Fi):
;     RADAR_OTA_PIN=123456 ~/.platformio/penv/bin/pio run -e viewe7-ota -t upload --upload-port radar.local
[env:viewe7-ota]
extends = env:viewe7
upload_protocol = espota
upload_port = radar.local
; the radar erases the whole slot before it answers (about 15-30 s), so espota must wait longer than its 10 s default
upload_flags =
    --auth=${sysenv.RADAR_OTA_PIN}
    --timeout=90

[env:viewe7]
extra_scripts = pre:../tools/pio_gzip.py   ; gzips data/page.html (the web interface) before it is embedded
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi     ; 16 MB quad flash + 8 MB octal PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv     ; two 6.5 MB OTA slots (OTA arrives in M7)
upload_speed = 230400                         ; CH340 is unreliable above this
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.embed_files =                      ; offline place data: cities -> country + time zone (geo.bin), world outline for the map picker (world.bin); see tools/build_geo.py
    data/geo.bin
    data/world.bin
    data/leaflet.js.gz
    data/leaflet.css.gz
    data/airlines.bin
    data/page.html.gz
    data/mapdata.bin
    data/flags.bin
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0               ; console on UART0 (CH340)
    -DCORE_DEBUG_LEVEL=1
    -I${PROJECT_DIR}/../config
lib_deps =
    lovyan03/LovyanGFX@1.2.32
    bblanchon/ArduinoJson@^7.4.0

; Rebuilds the Arduino IDF libraries once (~10-20 min, then cached) with one change to Espressif's RGB LCD driver:
;   RESTART_IN_VSYNC=y (Arduino default) never resets the bounce-buffer EOF counter, so a single late DMA interrupt
;   (PSRAM burst, flash write) leaves the two bounce buffers swapped for good -> permanent tearing until power cycle.
;   =n resets the counter every VSYNC and restarts the DMA only after a short/missed frame: a glitch heals within one frame.
; The two MBEDTLS_*_MEM_ALLOC lines have NO effect (the mbedTLS libraries are prebuilt); TLS memory is moved to PSRAM by src/tls_psram.cpp. Drop the lines at the next library rebuild.
; NOTE: this replaces the shared framework-arduinoespressif32-libs package; other Arduino envs (hardware-tests/diag) trigger a reinstall.
;   The rest restores what the stock qio_opi variant has and the generic rebuild base lacks (octal PSRAM, PSRAM-friendly Wi-Fi buffers).
custom_sdkconfig =
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
    CONFIG_SPIRAM_MODE_QUAD=n
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER=n
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=32
    CONFIG_ESP_WIFI_RX_BA_WIN=6
    CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=4
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
custom_component_remove =
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp-dsp
    espressif/esp32-camera
    espressif/libsodium
    espressif/esp-modbus
    espressif/qrcode
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common
